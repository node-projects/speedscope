name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build standalone package
        run: npm run prepack
      - name: Build single HTML app
        run: npm run build:single-file
      - name: Check npm contents and CLI
        run: |
          npm pack --dry-run --ignore-scripts
          node bin/cli.mjs --version
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            dist/speedscope-*.zip
            dist/speedscope-standalone.html
          if-no-files-found: error
