name: Publish npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published GitHub release tag to retry
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'node-projects/speedscope'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Set package version from the published release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_METADATA="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)"
          npm run release:version
      - run: npm test
      - name: Check whether this npm version already exists
        id: registry
        run: node scripts/npm-release-status.mjs
      - name: Build and pack release
        run: |
          mkdir -p dist/npm
          npm pack --pack-destination dist/npm
      - name: Attach standalone archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/speedscope-*.zip --clobber
      - name: Attach new npm archive to GitHub release
        if: steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/npm/*.tgz --clobber
      - name: Publish package to npm
        if: steps.registry.outputs.published != 'true'
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist-tag }}
        run: npm publish dist/npm/*.tgz --ignore-scripts --access public --provenance --tag "$NPM_DIST_TAG"
